apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: humor-game-monitor:apps/Deployment:humor-game/backend
    gitops.argoproj.io/description: Safe GitOps monitoring for Humor Game
    gitops.argoproj.io/version: 1.0.0
  labels:
    app.kubernetes.io/instance: dev
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: humor-game
    app.kubernetes.io/part-of: gitops-demo:
  name: backend
  namespace: humor-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      app.kubernetes.io/instance: dev
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/name: humor-game
      app.kubernetes.io/part-of: gitops-demo
  template:
    metadata:
      annotations:
        argocd.argoproj.io/tracking-id: humor-game-monitor:/kustomization.yaml
        gitops.argoproj.io/description: Safe GitOps monitoring for Humor Game
        gitops.argoproj.io/version: 1.0.0
        prometheus.io/path: /metrics
        prometheus.io/port: '3001'
        prometheus.io/scrape: 'true'
      labels:
        app: backend
        app.kubernetes.io/instance: dev
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/name: humor-game
        app.kubernetes.io/part-of: gitops-demo
    spec:
      containers:
        - name: backend
          image: humor-game-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: humor-game-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: humor-game-config
                  key: API_PORT
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: humor-game-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: humor-game-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: humor-game-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: humor-game-config
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: humor-game-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: humor-game-secrets
                  key: JWT_SECRET
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: humor-game-config
                  key: CORS_ORIGIN
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: humor-game-config
                  key: FRONTEND_URL
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: humor-game-config
                  key: API_BASE_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: humor-game
spec:
  selector:
    app: backend
  ports:
    - port: 3001

